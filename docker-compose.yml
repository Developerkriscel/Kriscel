version: '3.9'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kriscel-api
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=${NEXT_PUBLIC_CLIENT_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - '5000:5000'
    restart: unless-stopped

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kriscel-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_CLIENT_URL=${NEXT_PUBLIC_CLIENT_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_CLIENT_URL}
      - PORT=3000
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped
